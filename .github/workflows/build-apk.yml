name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-output.log
        continue-on-error: true

      - name: Surface failure as annotations
        if: steps.build.outcome == 'failure'
        run: |
          grep -nE "^e: |error:|exception|FAILED|what went wrong|caused by|unresolved reference|cannot find symbol" /tmp/gradle-output.log -i | tail -40 > /tmp/gradle-errors.log || true
          if [ ! -s /tmp/gradle-errors.log ]; then
            tail -40 /tmp/gradle-output.log > /tmp/gradle-errors.log
          fi
          while IFS= read -r line; do
            clean=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::${clean}"
          done < /tmp/gradle-errors.log
          exit 1

      - name: List build outputs
        if: always()
        run: |
          FOUND=$(find app/build -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 || true)
          TREE=$(find app -maxdepth 4 -type d 2>&1 | tr '\n' ' | ' || true)
          echo "::warning::APK_SEARCH=[${FOUND}] DIR_TREE=[${TREE}]"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
